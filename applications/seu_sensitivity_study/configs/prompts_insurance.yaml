# Prompt templates for the INSURANCE pool (study plan §3.2, §3.3, §6.1).
#
# See prompts_venture.yaml for the shared structure and the two invariants it
# enforces (one neutral assessment prompt; prompt conditions differ only in
# `choice.instructions`).
#
# Pool-specific note: insurance is the replication anchor, but an APPROXIMATE
# one (§6.3). The role and task match the methodology-paper pipeline, while the
# answer format is the hardened `ANSWER: n` token (§6.4) rather than that
# pipeline's bare-number instruction. That departure is deliberate and pinned
# in provenance; it sits alongside the anchor's other declared departures
# (item-text embeddings §5, choice-only prompt scope §3.2, menu sizes §3.4).
#
# The K=3 consequences are the investigator-agreement outcomes carried by the
# legacy claims file; they are interpolated via {consequence_lines} rather than
# restated here, so the prompt cannot drift from the pool definition.
#
# Placeholders filled by the collectors:
#   assessment.user_prompt : {item_text}, {consequence_lines}, {probability_format}
#   choice.user_prompt     : {instruction}, {assessments_list}, {n_max}

schema_version: "1.0"
pool_id: insurance

assessment:
  system_prompt: |
    You are an insurance claims analyst. You review incoming claims and judge
    how a review of the claim is likely to turn out.

  user_prompt: |
    Review the following insurance claim and assess how likely each possible
    outcome is.

    Claim:
    {item_text}

    Possible outcomes:
    {consequence_lines}

    Give a brief assessment in 2-4 sentences, then end your reply with a single
    line in exactly this format:
    {probability_format}

    The probabilities must be decimals between 0 and 1 that sum to 1.

choice:
  system_prompt: |
    You are an insurance claims analyst. You are choosing which one of several
    claims to forward to investigators.

  instructions:
    neutral: |
      Choose which claim to investigate.

    seu_maximizing: |
      Choose the claim that maximizes subjective expected value, given your
      assessed likelihoods for each possible outcome and the value of those
      outcomes.

    deliberative: |
      Think carefully and reason step by step before choosing.

  user_prompt: |
    Below are assessments of {n_max} claims.

    {assessments_list}

    {instruction}

    End your reply with a single line in exactly this format:
    ANSWER: n

    where n is a whole number between 1 and {n_max} identifying your choice.
