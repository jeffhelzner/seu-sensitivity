limitations:
- Staging is not evidence of provider submission, completed choices, or spending authorization.
- Recovery is simulation evidence under the fitted model, not empirical production estimates or formal SBC.
- Coverage is recomputed from current per-iteration 5%/95% summaries and true parameters, including the latest venture
  iteration 16; historical E4 coverage tables may predate that rerun.
- Recovery schedules are read from per-iteration chain headers, including archived schedules where available; last_launch_config
  is not evidence of earlier settings. Missing headers are explicitly unavailable.
- Scientific source provenance covers the frozen Stan likelihood, data preparation, and preregistration including
  embedded amendments. Chain provenance hashes only initial CSV headers, not posterior draw bytes.
- Assessed eta gaps use model-specific neutral probabilities and utilities (0, 0.5, 1); saved embedding-axis gate
  gaps are different quantities.
- The OpenAI flagship-minus-small contrast is the exact negative of gpt-4o-mini minus gpt-4o, retained in the declared
  family, not independent evidence.
- Matched procurement and hiring stimuli share merit keys; task-specific text and assessments need not be identical.
- No raw provider responses, hidden thinking blocks, credentials, job identifiers, chain files, or absolute machine
  paths are exported.
